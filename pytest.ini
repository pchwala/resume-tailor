[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
# Reuse the test database across runs — the DB is Neon (remote), so recreating it
# every run is slow and can deadlock on a lingering session. After a model/migration
# change, run once with `pytest --create-db` to rebuild it.
addopts = --reuse-db
